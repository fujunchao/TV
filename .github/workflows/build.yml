name: 构建 Release APK

on:
  push:
    branches: [ TV-MPV ]
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 签出代码
        uses: actions/checkout@v4

      - name: 配置 JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: 配置 Gradle 缓存
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: 解码签名文件
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$KEYSTORE_BASE64" | tr -d '\n\r ' | base64 -d > app/fongmi.jks

      - name: 赋予 Gradle 执行权限
        run: chmod +x gradlew

      - name: 构建 mobile-arm64_v8a
        env:
          KEYSTORE_FILE: fongmi.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleMobileArm64_v8aRelease

      - name: 构建 mobile-armeabi_v7a
        env:
          KEYSTORE_FILE: fongmi.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleMobileArmeabi_v7aRelease

      - name: 构建 leanback-arm64_v8a
        env:
          KEYSTORE_FILE: fongmi.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleLeanbackArm64_v8aRelease

      - name: 构建 leanback-armeabi_v7a
        env:
          KEYSTORE_FILE: fongmi.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleLeanbackArmeabi_v7aRelease

      - name: 整理 APK 文件
        run: |
          mkdir -p release/apk
          cp app/build/outputs/apk/mobile/arm64_v8a/release/mobile-arm64_v8a.apk release/apk/
          cp app/build/outputs/apk/mobile/armeabi_v7a/release/mobile-armeabi_v7a.apk release/apk/
          cp app/build/outputs/apk/leanback/arm64_v8a/release/leanback-arm64_v8a.apk release/apk/
          cp app/build/outputs/apk/leanback/armeabi_v7a/release/leanback-armeabi_v7a.apk release/apk/

      - name: 上传 APK 产物
        uses: actions/upload-artifact@v4
        with:
          name: release-apks
          path: release/apk/*.apk
          retention-days: 90

      - name: 创建 Release（仅 tag 触发）
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: release/apk/*.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
