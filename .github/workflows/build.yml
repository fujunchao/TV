name: 构建Android APK

on:
  push:
    branches: [ release ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v3

      - name: 设置JDK
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: 授予执行权限
        run: chmod +x gradlew

      - name: 构建APK
        run: ./gradlew assembleLeanbackArm64_v8aRelease

      - name: 上传APK
        uses: actions/upload-artifact@v3
        with:
          name: app-leanback-arm64_v8a-release
          path: app/build/outputs/apk/leanback/arm64_v8a/release/*.apk 